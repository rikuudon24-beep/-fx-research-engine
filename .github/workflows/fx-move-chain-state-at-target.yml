name: FX State-at-Target Continuation Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_move_chain_state_at_target.py"
      - "scripts/research_50pip_mtf_structure.py"
      - "data/market/**"
      - ".github/workflows/fx-move-chain-state-at-target.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run state-at-target research
        run: python -u scripts/research_move_chain_state_at_target.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: move-chain-state-at-target-research
          path: |
            reports/move_chain_state_at_target.csv
            reports/move_chain_state_at_target_robustness.csv
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/move_chain_state_at_target.csv reports/move_chain_state_at_target_robustness.csv
          git diff --cached --quiet || git commit -m "research: save state-at-target continuation results"
          git push
