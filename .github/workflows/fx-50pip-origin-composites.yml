name: FX 50pip Origin Composite Research
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_50pip_origin_composites.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-50pip-origin-composites.yml"
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python -m pip install --upgrade pip pandas numpy
      - run: python -u scripts/research_50pip_origin_composites.py
      - uses: actions/upload-artifact@v4
        with:
          name: 50pip-origin-composite-research
          path: reports/50pip_origin_composite*.csv
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_origin_composite*.csv
          git diff --cached --quiet || git commit -m "research: save origin composite results"
          git push
