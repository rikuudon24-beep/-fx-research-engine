name: FX Move Ladder Composite Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_move_ladder_composite.py"
      - "scripts/research_50pip_mtf_structure.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-move-ladder-composite.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run move ladder research
        run: python -u scripts/research_move_ladder_composite.py
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: move-ladder-composite-research
          path: |
            reports/move_ladder_composite_oos.csv
            reports/move_ladder_composite_robustness.csv
            reports/move_ladder_composite_shortlist.csv
      - name: Commit research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/move_ladder_composite_oos.csv reports/move_ladder_composite_robustness.csv reports/move_ladder_composite_shortlist.csv
          git diff --cached --quiet || git commit -m "research: save move ladder composite results"
          git push
