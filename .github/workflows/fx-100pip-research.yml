name: FX 50pip Event Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/extract_100pip_events.py"
      - "scripts/research_50pip_conditions.py"
      - "scripts/research_50pip_continuation.py"
      - "scripts/research_50pip_trade_path.py"
      - "scripts/research_50pip_direct_entry.py"
      - "scripts/research_50pip_entry_effects.py"
      - "data/market/**"
      - ".github/workflows/fx-100pip-research.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Extract 50pip+ events
        run: python scripts/extract_100pip_events.py
      - name: Research indicator conditions
        run: python scripts/research_50pip_conditions.py
      - name: Research 50pip continuation and OOS
        run: python scripts/research_50pip_continuation.py
      - name: Research 50pip trade path
        run: python scripts/research_50pip_trade_path.py
      - name: Research direct +50 entry conditions
        run: python scripts/research_50pip_direct_entry.py
      - name: Research entry feature and transition effects
        run: python scripts/research_50pip_entry_effects.py
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-research
          path: |
            reports/50pip_events.csv
            reports/50pip_event_summary.csv
            reports/50pip_data_quality.csv
            reports/50pip_condition_summary.csv
            reports/50pip_condition_pair_summary.csv
            reports/50pip_feature_dataset.csv
            reports/50pip_continuation_combinations.csv
            reports/50pip_continuation_oos.csv
            reports/50pip_continuation_robustness.csv
            reports/50pip_candidate_shortlist.csv
            reports/50pip_focus_pair_detail.csv
            reports/50pip_trade_path_focus.csv
            reports/50pip_trade_path_focus_summary.csv
            reports/50pip_direct_entry_conditions.csv
            reports/50pip_direct_entry_oos.csv
            reports/50pip_direct_entry_robustness.csv
            reports/50pip_entry_feature_effects.csv
            reports/50pip_entry_incremental_effects.csv
      - name: Commit research datasets
        run: |
          git config user.name "fx-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_events.csv reports/50pip_event_summary.csv reports/50pip_data_quality.csv reports/50pip_condition_summary.csv reports/50pip_condition_pair_summary.csv reports/50pip_feature_dataset.csv reports/50pip_continuation_combinations.csv reports/50pip_continuation_oos.csv reports/50pip_continuation_robustness.csv reports/50pip_candidate_shortlist.csv reports/50pip_focus_pair_detail.csv reports/50pip_trade_path_focus.csv reports/50pip_trade_path_focus_summary.csv reports/50pip_direct_entry_conditions.csv reports/50pip_direct_entry_oos.csv reports/50pip_direct_entry_robustness.csv reports/50pip_entry_feature_effects.csv reports/50pip_entry_incremental_effects.csv
          git diff --cached --quiet || git commit -m "research: update core research datasets"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
