name: FX Operational Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: python -m pip install pandas numpy
    - run: python scripts/research_operational_validation.py
    - uses: actions/upload-artifact@v4
      with:
        name: operational-validation
        path: reports/operational_*.csv
