name: FX Operational Validation
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install pandas numpy requests
    - run: python scripts/research_final_candidate_trade.py
    - run: python scripts/research_operational_validation.py
    - uses: actions/upload-artifact@v4
      with:
        name: operational-validation
        path: reports/operational_*.csv
