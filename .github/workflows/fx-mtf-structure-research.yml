name: FX MTF Structure Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_50pip_mtf_structure.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-mtf-structure-research.yml"

permissions:
  contents: write

jobs:
  mtf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run MTF and structure research
        run: python -u scripts/research_50pip_mtf_structure.py
      - name: Upload MTF research reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-mtf-structure-research
          path: |
            reports/50pip_mtf_structure_conditions.csv
            reports/50pip_mtf_structure_oos.csv
            reports/50pip_mtf_structure_robustness.csv
      - name: Commit MTF research datasets
        run: |
          git config user.name "fx-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf 'run_commit=%s\nrun_utc=%s\n' "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > reports/mtf_latest_run_manifest.txt
          git add reports/50pip_mtf_structure_conditions.csv reports/50pip_mtf_structure_oos.csv reports/50pip_mtf_structure_robustness.csv reports/mtf_latest_run_manifest.txt
          git diff --cached --quiet || git commit -m "research: save MTF research result manifest"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
