name: FX Notification Trade Ledger
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install pandas numpy requests
    - run: python scripts/research_notification_replay.py
    - run: python scripts/research_notification_trade_ledger.py
    - uses: actions/upload-artifact@v4
      with:
        name: notification-trade-ledger
        path: reports/notification_trade_*.csv
