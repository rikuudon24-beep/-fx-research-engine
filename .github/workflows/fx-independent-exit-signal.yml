name: FX Independent Exit Signal Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_independent_exit_signal.py"
      - "scripts/research_50pip_mtf_structure.py"
      - "data/market/**"
      - ".github/workflows/fx-independent-exit-signal.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run independent exit signal research
        run: python -u scripts/research_independent_exit_signal.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: independent-exit-signal-research
          path: |
            reports/independent_exit_signal.csv
            reports/independent_exit_signal_robustness.csv
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/independent_exit_signal.csv reports/independent_exit_signal_robustness.csv
          git diff --cached --quiet || git commit -m "research: save independent exit signal results"
          git push
