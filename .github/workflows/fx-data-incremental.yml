name: FX Data Incremental
on:
  schedule:
    - cron: "17 6 * * 1-5"
      timezone: "Asia/Tokyo"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fx-data-research
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python scripts/download_market_data.py --mode incremental
      - run: python scripts/provenance_report.py
      - run: python scripts/validate_market_data.py
      - name: Commit data
        run: |
          git config user.name "fx-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market reports/data_provenance.json
          git diff --cached --quiet || git commit -m "data: update FX market data"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: fx-data-provenance-${{ github.run_number }}
          path: reports/data_provenance.json
