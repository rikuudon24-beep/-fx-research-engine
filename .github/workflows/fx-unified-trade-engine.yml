name: FX Unified Operational Trade Engine
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install pandas numpy requests
    - run: python scripts/research_final_candidate_trade.py
    - run: python scripts/research_unified_trade_engine.py
    - uses: actions/upload-artifact@v4
      with:
        name: unified-trade-engine
        path: reports/unified_*.csv
