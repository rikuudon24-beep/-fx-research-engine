name: FX Chart Toolkit Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_50pip_chart_toolkit.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-chart-toolkit-research.yml"

permissions:
  contents: write

jobs:
  chart-toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pandas numpy
      - name: Run chart toolkit research
        run: python -u scripts/research_50pip_chart_toolkit.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-chart-toolkit-research
          path: |
            reports/50pip_chart_toolkit_effects.csv
            reports/50pip_chart_toolkit_incremental.csv
      - name: Persist reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_chart_toolkit_effects.csv reports/50pip_chart_toolkit_incremental.csv
          git diff --cached --quiet || git commit -m "research: add chart toolkit reports"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
