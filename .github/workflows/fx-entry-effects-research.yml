name: FX Entry Effects Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_50pip_entry_effects.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-entry-effects-research.yml"

permissions:
  contents: write

jobs:
  effects:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pandas numpy
      - name: Run entry feature effects
        run: python -u scripts/research_50pip_entry_effects.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-entry-effects
          path: |
            reports/50pip_entry_feature_effects.csv
            reports/50pip_entry_incremental_effects.csv
      - name: Commit reports
        run: |
          git config user.name "fx-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_entry_feature_effects.csv reports/50pip_entry_incremental_effects.csv
          git diff --cached --quiet || git commit -m "research: update directional entry effects"
          git push
