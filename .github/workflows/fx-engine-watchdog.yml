name: FX Engine Watchdog

on:
  workflow_run:
    workflows: ["FX Data Gap Repair"]
    types: [completed]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: fx-engine-watchdog
  cancel-in-progress: false

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and recover
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail

          REPO="${{ github.repository }}"
          WORKFLOW="FX Data Gap Repair"
          MAX_ATTEMPTS=3
          STUCK_MINUTES=190
          INACTIVE_MINUTES=35

          echo "=== FX Engine Watchdog ==="

          # For workflow_run events, inspect that exact run.
          # For scheduled/manual watchdog runs, inspect the latest repair run.
          if [ -n "$EVENT_RUN_ID" ]; then
            RUN_ID="$EVENT_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi

          if [ -z "$RUN_ID" ]; then
            echo "No FX Data Gap Repair run found."
            exit 0
          fi

          RUN_JSON="$(gh run view "$RUN_ID" --repo "$REPO" --json status,conclusion,runAttempt,createdAt,updatedAt,url)"
          echo "$RUN_JSON"

          STATUS="$(jq -r '.status' <<<"$RUN_JSON")"
          CONCLUSION="$(jq -r '.conclusion // ""' <<<"$RUN_JSON")"
          ATTEMPT="$(jq -r '.runAttempt // 1' <<<"$RUN_JSON")"
          CREATED="$(jq -r '.createdAt' <<<"$RUN_JSON")"
          URL="$(jq -r '.url' <<<"$RUN_JSON")"

          notify_issue() {
            local title="$1"
            local body="$2"
            echo "$body"
            gh issue create --repo "$REPO" --title "$title" --body "$body" || true
          }

          # Completed successful run: nothing to recover.
          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then
            echo "[OK] FX Data Gap Repair completed successfully."
            exit 0
          fi

          # Never endlessly retry the same run.
          if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
            notify_issue               "FX watchdog: manual intervention required"               "FX Data Gap Repair needs manual intervention. Run: $URL
Status: $STATUS
Conclusion: $CONCLUSION
Attempt: $ATTEMPT

The watchdog stopped automatic retries to avoid an infinite repair loop."
            exit 0
          fi

          # Inspect failed jobs and their logs. Recovery is biased toward keeping
          # the research pipeline moving: transient failures are retried, and
          # code/unknown failures are retried from the latest main revision so that
          # a newer repair strategy can take effect.
          JOBS="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="cancelled") | [.id,.name,.conclusion] | @tsv' || true)"

          CODE_BUG=0
          TRANSIENT=0
          DETAILS=""

          while IFS=$'\t' read -r JOB_ID JOB_NAME JOB_CONCLUSION; do
            [ -z "$JOB_ID" ] && continue
            LOG="$(gh api "repos/$REPO/actions/jobs/$JOB_ID/logs" 2>/dev/null || true)"
            DETAILS="$DETAILS\n### $JOB_NAME ($JOB_CONCLUSION)\n"
            DETAILS="$DETAILS$(printf '%s\n' "$LOG" | tail -n 80)\n"

            if printf '%s' "$LOG" | grep -Eq 'SyntaxError|IndentationError|NameError:|ModuleNotFoundError|ImportError|AssertionError'; then
              CODE_BUG=1
            fi

            if printf '%s' "$LOG" | grep -Eq 'HTTP 429|HTTP 5[0-9][0-9]|timeout|timed out|ETIMEDOUT|ECONNRESET|empty/out-of-range CSV|datafeed|network'; then
              TRANSIENT=1
            fi
          done <<< "$JOBS"

          if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
            if [ "$TRANSIENT" -eq 1 ] && [ "$CODE_BUG" -eq 0 ]; then
              echo "[RECOVERY] transient failure detected; rerunning failed jobs."
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
              exit 0
            fi

            # A code/unknown failure may already have been fixed on main while
            # this run was executing. Start a fresh run from current main rather
            # than replaying the old commit. This is the important "don't wait
            # for the human" path.
            echo "[RECOVERY] non-transient failure; dispatching a fresh repair run from main."
            gh workflow run "FX Data Gap Repair" \
              --repo "$REPO" \
              --ref main \
              -f start=2021-01-01 \
              -f end=2026-09-20
            exit 0
          fi

          # Stuck-run protection: never cancel merely because the workflow is old.
          # First check whether any job has reported activity recently. A long-running
          # repair can be healthy; only an old run with no recent job activity is
          # considered stuck.
          if [ "$STATUS" = "in_progress" ]; then
            AGE_SECONDS=$(( $(date -u +%s) - $(date -u -d "$CREATED" +%s) ))
            AGE_MINUTES=$(( AGE_SECONDS / 60 ))
            echo "Run age: ${AGE_MINUTES} minutes"

            JOB_STATE="$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '
              [.jobs[] | select(.status=="in_progress" or .status=="queued") |
               {status:.status, updated_at:.updated_at}]')"

            RECENT=0
            NOW="$(date -u +%s)"
            while read -r TS; do
              [ -z "$TS" ] && continue
              T="$(date -u -d "$TS" +%s)"
              AGE=$(( (NOW - T) / 60 ))
              if [ "$AGE" -le "$INACTIVE_MINUTES" ]; then
                RECENT=1
                echo "[WATCH] active job updated ${AGE} min ago."
                break
              fi
            done < <(jq -r '.[].updated_at' <<<"$JOB_STATE")

            if [ "$RECENT" -eq 1 ]; then
              echo "[WATCH] run is old but still active; do not cancel."
              exit 0
            fi

            if [ "$AGE_MINUTES" -ge "$STUCK_MINUTES" ]; then
              echo "[RECOVERY] run is old and has had no recent job activity; cancelling and restarting."
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/cancel" || true
              sleep 5
              gh api -X POST "repos/$REPO/actions/runs/$RUN_ID/rerun"
              exit 0
            fi
          fi

          echo "[WATCH] no recovery action required."
