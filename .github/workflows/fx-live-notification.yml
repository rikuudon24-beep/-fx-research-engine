name: FX Live Notification Monitor

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
  push:
    branches: [main]:

concurrency:
  group: fx-live-notification
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh market data
        run: |
          python scripts/download_market_data.py --mode incremental --end "$(date -u -d '+1 day' +%F)"
          python scripts/validate_market_data.py

      - name: Evaluate notification state
        run: |
          pip install pandas numpy
          python scripts/monitor_notification_state.py

      - name: Publish refreshed data and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market reports/current_notification_state.csv reports/current_notification_candidates.csv reports/current_notification_alerts.csv
          if git diff --cached --quiet; then
            echo "No market/state changes to commit."
          else
            git commit -m "chore: refresh FX notification state"
            git push
          fi

      - name: Create durable alert issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s reports/current_notification_alerts.csv ]; then
            echo "No entry alerts."
            exit 0
          fi

          python - <<'PY' > /tmp/alerts.tsv
          import csv
          with open("reports/current_notification_alerts.csv", newline="") as f:
              for r in csv.DictReader(f):
                  print("\t".join([
                      r["notification_id"], r["pair"], r["direction"],
                      r["signal_candle"], r["entry_candidate_h4"]
                  ]))
          PY

          while IFS=$'\t' read -r id pair direction signal entry; do
            [ -z "$id" ] && continue
            existing=$(gh issue list --state open --search "FX ALERT $pair $direction in:title" --json title --jq '.[].title' | grep -F "$signal" || true)
            if [ -n "$existing" ]; then
              echo "Already published: $id"
              continue
            fi

            title="FX ALERT $pair $direction $signal"
            body="## FX entry alert

- Pair: $pair
- Direction: $direction
- Signal candle (completed H4): $signal
- Next H4 entry candidate: $entry
- Rule: frozen H4 state-machine notification rule
- Source: Dukascopy bid H4 data refreshed by GitHub Actions

This issue is a durable notification event. Do not treat it as an execution order."
            gh issue create --title "$title" --body "$body" || true
          done < /tmp/alerts.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: live-notification-state
          path: |
            reports/current_notification_state.csv
            reports/current_notification_candidates.csv
            reports/current_notification_alerts.csv
