name: FX 50pip Origin Signal Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_50pip_origin_signals.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-50pip-origin-signals.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run origin signal study
        run: python -u scripts/research_50pip_origin_signals.py
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-origin-signal-research
          path: |
            reports/50pip_origin_signal_prevalence.csv
            reports/50pip_origin_signal_transitions.csv
            reports/50pip_origin_event_samples.csv
      - name: Commit research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_origin_signal_prevalence.csv reports/50pip_origin_signal_transitions.csv reports/50pip_origin_event_samples.csv
          git diff --cached --quiet || git commit -m "research: save 50pip origin signal results"
          git push
