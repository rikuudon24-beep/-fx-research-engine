name: FX Momentum Decay Exit Research

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/research_momentum_decay_exit.py"
      - "scripts/research_50pip_mtf_structure.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-momentum-decay-exit.yml"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run momentum decay exit research
        run: python -u scripts/research_momentum_decay_exit.py
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: momentum-decay-exit-research
          path: |
            reports/momentum_decay_exit.csv
            reports/momentum_decay_exit_robustness.csv
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/momentum_decay_exit.csv reports/momentum_decay_exit_robustness.csv
          git diff --cached --quiet || git commit -m "research: save momentum decay exit results"
          git push
