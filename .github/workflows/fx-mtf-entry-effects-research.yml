name: FX MTF Entry Effects Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/research_50pip_mtf_effects.py"
      - "scripts/research_50pip_mtf_structure.py"
      - "scripts/research_50pip_direct_entry.py"
      - "data/market/**"
      - ".github/workflows/fx-mtf-entry-effects-research.yml"

permissions:
  contents: write

jobs:
  mtf-effects:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Run MTF feature effects
        run: python -u scripts/research_50pip_mtf_effects.py
      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: 50pip-mtf-entry-effects
          path: |
            reports/50pip_mtf_feature_effects.csv
            reports/50pip_mtf_incremental_effects.csv
      - name: Persist research reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/50pip_mtf_feature_effects.csv reports/50pip_mtf_incremental_effects.csv
          git diff --cached --quiet || git commit -m "research: add MTF entry effects reports"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push && exit 0
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
