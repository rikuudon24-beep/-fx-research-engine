name: FX Frozen Rule OOS Pair Robustness
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: {python-version: '3.11'}
    - run: pip install pandas numpy requests
    - run: python scripts/research_frozen_rule_oos_robustness.py
    - uses: actions/upload-artifact@v4
      with:
        name: frozen-rule-oos-robustness
        path: reports/frozen_rule_oos_*.csv
