name: FX Monitoring Stability
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas numpy
      - run: python scripts/research_monitoring_stability.py
      - run: |
          echo "=== STABILITY SUMMARY ==="
          cat reports/monitoring_stability_summary.csv
          echo "=== SCREEN ==="
          cat reports/monitoring_stability_screen.csv
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-stability
          path: reports/monitoring_stability_*.csv
