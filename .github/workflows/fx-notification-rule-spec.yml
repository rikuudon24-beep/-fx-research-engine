name: FX Notification Rule Specification
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - run: python -m pip install pandas
    - run: python scripts/build_notification_rule_spec.py
    - uses: actions/upload-artifact@v4
      with:
        name: notification-rule-spec
        path: reports/notification_*.csv
