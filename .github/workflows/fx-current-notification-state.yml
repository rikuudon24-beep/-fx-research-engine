name: FX Current Notification State

on:
  push:
    branches:
      - main
    paths-ignore:
      - "data/market/**"
      - "reports/**"
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh market data
        run: |
          python scripts/download_market_data.py --mode incremental --end "$(date -u -d '+1 day' +%F)"
          python scripts/validate_market_data.py
      - name: Evaluate notification state
        run: |
          python -m pip install pandas numpy
          python scripts/monitor_notification_state.py
      - name: Publish refreshed data and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market reports/current_notification_state.csv reports/current_notification_candidates.csv reports/current_notification_alerts.csv
          if git diff --cached --quiet; then
            echo "No market/state changes to commit."
          else
            git commit -m "chore: refresh FX notification state"
            git push
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: current-notification-state
          path: reports/current_notification_*.csv
